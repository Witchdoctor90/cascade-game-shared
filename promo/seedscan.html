<!doctype html><meta charset="utf-8"><body>
<canvas id="c" style="width:300px;display:block"></canvas>
<script src="../assets/js/cascade.js"></script>
<script src="stage.js"></script>
<script>
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
window.scan = function(seed, secs){
  Math.random = mulberry(seed);
  const cv = document.getElementById('c'); const realRandom = mulberry(seed ^ 0x9e3779b9);
  const turns = []; let cur = null; let ev = [];
  const g = Cascade.createGame(cv, {onEvent(type,d){ if(type==='break') ev.push([g.time, d.combo]); }});
  const st = g._state; let lastPhase = st.phase; let t = 0; let setTurn=0;
  while (t < secs) {
    if (st.phase==='ready' && setTurn!==st.turn){ setTurn=st.turn; PromoStage.onReady(st); }
    g._step(1/120); t += 1/120;
    if (st.phase === 'firing' && lastPhase !== 'firing') cur = {start: t, max: 0, score0: st.score};
    if (cur && st.combo > cur.max) cur.max = st.combo;
    if (lastPhase === 'firing' && st.phase !== 'firing') { cur.end = t; cur.gain = st.score - cur.score0; turns.push(cur); cur = null; }
    lastPhase = st.phase;
  }
  return {seed, turns, score: st.score, ev};
}
</script>
